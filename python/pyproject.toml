[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "csestudy"
version = "0.1.0"
description = "Time-series inference for cross-sectional event studies"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Jonathan B. Cohn"},
    {name = "Travis L. Johnson"},
    {name = "Zack Liu"},
    {name = "Malcolm I. Wardlaw"},
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
csestudy = "csestudy.__main__:main"

[project.urls]
Paper = "https://doi.org/10.1016/j.jfineco.2026.104278"
Repository = "https://github.com/MalcolmWardlaw/csestudy"

[tool.setuptools.packages.find]
where = ["."]
